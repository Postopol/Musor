<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1><span class="dot"></span>Расширение Цвет <span class="ver" id="ver"></span></h1>

  <div class="modes" id="modes"></div>
  <label class="auto-row"><input type="checkbox" id="autoDN"> Авто день/ночь</label>
  <label class="auto-row" title="Стили и рандом красят всё, кроме видео. На видео действуют только ползунки «Медиа»"><input type="checkbox" id="protectVideo"> Не трогать видео</label>

  <div class="grid" id="presets"></div>

  <button id="random" class="random">🎲 Рандом всего CSS</button>

  <div class="save-row">
    <input type="text" id="saveName" placeholder="Название стиля" maxlength="30">
    <button id="saveBtn">Сохранить</button>
  </div>

  <div class="import-row">
    <input type="text" id="importCode" placeholder="Вставь код стиля друга">
    <button id="importBtn">Импорт</button>
  </div>

  <details class="tuner" id="tuner">
    <summary>Тонкая настройка</summary>
    <label>Оттенок <span id="hueVal">0°</span><input type="range" id="hue" min="0" max="360" value="0"></label>
    <label>Насыщенность <span id="satVal">100%</span><input type="range" id="sat" min="0" max="300" value="100"></label>
    <label>Яркость <span id="brightVal">100%</span><input type="range" id="bright" min="50" max="150" value="100"></label>
    <label>Размер шрифта <span id="fsVal">100%</span><input type="range" id="fs" min="80" max="130" value="100"></label>
    <button class="tuner-reset" id="tuneReset">Сбросить ползунки</button>
  </details>

  <details class="tuner" id="mediaBox">
    <summary>Медиа: картинки и видео</summary>
    <label>Оттенок <span id="mHueVal">0°</span><input type="range" id="mHue" min="0" max="360" value="0"></label>
    <label>Насыщенность <span id="mSatVal">100%</span><input type="range" id="mSat" min="0" max="300" value="100"></label>
    <label>Яркость <span id="mBrightVal">100%</span><input type="range" id="mBright" min="50" max="150" value="100"></label>
    <button class="tuner-reset" id="mediaReset">Сбросить медиа</button>
  </details>

  <div class="saved hidden" id="saved">
    <div class="saved-title">Мои стили</div>
    <div id="savedList"></div>
  </div>

  <details class="sites" id="sitesBox">
    <summary>Сайты <span class="count" id="sitesCount">0</span></summary>
    <div id="sitesList"></div>
  </details>

  <p id="status"></p>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
